name: Sync AGENTS.md to target repos

on:
  push:
    branches: [main]
    paths:
      - 'base/**'
  workflow_dispatch:

# Avoid two concurrent syncs racing each other on the same target repos.
concurrency:
  group: sync-agents
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playbook
        uses: actions/checkout@v6
        with:
          # Need full history so sync.sh can compute the commit that last
          # modified base/AGENTS.md (used for stable metadata stamping).
          fetch-depth: 0

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run sync script
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: bash scripts/sync.sh
